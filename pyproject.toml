[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tatkal-sim"
version = "0.0.1"
description = "tatkal-spike-prototype: deterministic discrete-event simulation of a Tatkal-style booking spike (spec: docs/specs/tatkal-spike-prototype)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.black]
line-length = 100
